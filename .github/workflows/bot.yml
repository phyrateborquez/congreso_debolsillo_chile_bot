name: Bot Congreso Chile

on:
  schedule:
    # Ejecutar 1 vez al día a las 8:00 AM de Chile (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:  # Permitir ejecución manual para testing

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates fonts-liberation \
            libappindicator3-1 libatk-bridge2.0-0 libatk1.0-0 libc6 \
            libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 \
            libgbm1 libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 \
            libpango-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 \
            libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 \
            libxi6 libxrandr2 libxrender1 libxss1 libxtst6 lsb-release \
            xdg-utils
          # If libasound2 is required and not available, install provider:
          if ! apt-cache show libasound2 >/dev/null 2>&1; then
            sudo apt-get install -y libasound2t64 || true
          else
            sudo apt-get install -y libasound2 || true
          fi
      
      - name: Install python & browser dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Restore database from cache
        uses: actions/cache@v4
        with:
          path: bot_database.db
          key: bot-db-${{ github.run_id }}
          restore-keys: |
            bot-db-

      - name: Run Twitter Bot
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          python twitter_bot.py

      - name: Cache database
        uses: actions/cache@v4
        with:
          path: bot_database.db
          key: bot-db-${{ github.run_id }}
