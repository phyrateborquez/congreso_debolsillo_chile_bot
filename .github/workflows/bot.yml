name: Bot Congreso Chile

on:
  schedule:
    # Ejecutar 1 vez al día a las 8:00 AM de Chile (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:  # Permitir ejecución manual para testing

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Usar el contenedor oficial de Microsoft con todo pre-instalado
    container:
      image: mcr.microsoft.com/playwright/python:v1.44.0-jammy
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore database from cache
        uses: actions/cache@v4
        with:
          path: bot_database.db
          key: bot-db-${{ github.run_id }}
          restore-keys: |
            bot-db-

      - name: Run Twitter Bot
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          python twitter_bot.py

      - name: Cache database
        uses: actions/cache@v4
        with:
          path: bot_database.db
          key: bot-db-${{ github.run_id }}
